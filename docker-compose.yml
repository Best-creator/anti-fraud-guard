name: anti-fraud-rag

services:
  milvus:
    image: milvusdb/milvus:v2.6.0
    container_name: anti-fraud-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      DEPLOY_MODE: STANDALONE
      ETCD_USE_EMBED: "true"
      ETCD_DATA_DIR: /var/lib/milvus/etcd
      COMMON_STORAGETYPE: local
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: anti-fraud-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  milvus_data:
  mongo_data:
